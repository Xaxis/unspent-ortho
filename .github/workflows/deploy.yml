name: deploy

# Export the web build and put it on Vercel. A push to main gets a preview URL;
# production — what unspent.world serves — is only ever a deliberate act, so it
# needs someone to run this by hand and say so.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'preview or production'
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-with-templates

      - name: Install Godot and templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          # The web export needs the templates for exactly this version.
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Brotli (tools/export.sh reports what goes over the wire)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq brotli

      - name: Import
        run: tools/_import.sh

      # The same default tools/deploy.sh exports with: dev mode behind the chord.
      - name: Export the web build
        run: tools/export.sh web --config=playtest

      # The deploy below skips the browser proof, because this runner has no GPU.
      # That let f1ab4dd ship green while every web boot logged "shader type fog
      # not supported": nothing on this side had ever started the build. Chromium
      # can draw WebGL2 on the CPU (SwiftShader), slowly, which is enough to boot
      # the title and fail on a console error. Proven both ways on 2026-09-23: main
      # booted clean (run 35829566324), and a branch with that fog bug put back
      # failed on it by name (run 35829603793). So it blocks the deploy.
      - name: Browser harness
        run: |
          npm install --prefix tools/web --no-audit --no-fund
          npx --prefix tools/web playwright install --with-deps chromium-headless-shell

      - name: Prove the web build boots (CPU WebGL)
        run: tools/web.sh --no-export --quick --swiftshader --boot-only --after=8 --timeout=400

      - name: Keep what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-proof
          path: shots/export/
          if-no-files-found: ignore

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # The browser proof needs a GPU this runner does not have; the machine
          # the game is built on runs it (tools/deploy.sh does it by default).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            tools/deploy.sh --prod --no-export --no-check
          else
            tools/deploy.sh --no-export --no-check
          fi
