name: gate

# The headless half of tools/check.sh on every push. The other half — real
# rendered frames and the tours that drive them through actual input — needs a
# GPU and stays on the machine where the game is being built; this catches what
# a test can catch, early and for free.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# DON'T CANCEL THE RUN IN PROGRESS. With cancel-in-progress true, every push to
# main killed the running gate, and several sessions push to main every few
# minutes while a run takes about half an hour -- so on 2026-09-22 no gate on main
# ever FINISHED: eight in a row were cancelled and the only verdict of the day was
# one that happened to outlive the next push. A gate that never finishes reports
# nothing and looks like it is working. Without cancelling, GitHub keeps the run
# going and holds only the LATEST pending push behind it (a newer push replaces
# an older pending one), so main always gets a verdict on a recent commit.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    # A hang guard, not a speed bar. The suite ran about 25 min after the camera
    # work; with interiors, foliage and the sky it outgrew 45 (2026-09-25: killed
    # with shards at 793, 608 and about 800 of roughly 850 each), then 80 (2026-09-26,
    # the homes and landscapes assembly: killed at shard 801, none red). A real hang
    # still runs past 120.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import
        run: tools/_import.sh

      - name: Tests
        # The gate's own test half: sharded and diffed against tests/standing.txt,
        # so CI goes red only on a NEW failure, exactly as tools/check.sh does.
        # Each shard prints only when it ends, so a run cancelled at the limit
        # said nothing about where it was. Every three minutes this prints the
        # last test each shard reached, which names a hang or a slow test.
        run: |
          ( while sleep 180; do
              for f in "${TMPDIR:-/tmp}"/unspent-test.*; do
                [ -f "$f" ] && echo "== progress $(basename "$f"): $(grep -cE '^\s+(ok|FAIL) ' "$f") done, last: $(grep -E '^\s+(ok|FAIL) ' "$f" | tail -1)"
              done
            done ) &
          tools/check.sh --no-shots
